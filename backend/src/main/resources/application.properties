spring.application.name=ams-backend

# Đọc file .env
spring.config.import=optional:file:./.env[.properties]

# Active profile: dev (H2) hoặc prod (MySQL)
spring.profiles.active=${SPRING_PROFILE:dev}

# ======================== DATABASE (default — override bởi profile) ========================
spring.datasource.url=${DB_URL:jdbc:h2:mem:ams_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# ======================== JPA / HIBERNATE ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt spring.sql.init
spring.sql.init.mode=never

# ======================== JWT ========================
jwt.secret=${JWT_SECRET:dGhpc0lzQVZlcnlMb25nU2VjcmV0S2V5Rm9yQU1TQXBwbGljYXRpb24yMDI0IQ==}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ======================== GOOGLE OAUTH2 ========================
google.client-id=${GOOGLE_CLIENT_ID:}

# ======================== GMAIL SMTP (gửi OTP) ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ======================== H2 Console (dev only) ========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-other=true

# ======================== SERVER ========================
server.port=${SERVER_PORT:8080}
